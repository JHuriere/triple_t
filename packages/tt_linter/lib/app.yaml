include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint

  language:
    # strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  errors:
    invalid_annotation_target: ignore
    dead_code: info
    missing_return: error
    todo: ignore

formatter:
  trailing_commas: preserve

linter:
  rules:
    # avoid_print: false
    prefer_single_quotes: true

