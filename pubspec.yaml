name: triple_t_workspace
environment:
  sdk: 3.10.8

dev_dependencies:
  melos: ^7.4.0

flutter:
  generate: true

workspace:
  - apps/triple_t

  - packages/tt_i18n
  - packages/tt_database
  - packages/tt_linter

  - features/error/error_presentation
  - features/game/game_data
  - features/game/game_domain
  - features/game/game_presentation
  - features/home/home_presentation
  - features/statistics/statistics_presentation
  - features/settings/settings_data
  - features/settings/settings_domain
  - features/settings/settings_presentation
  - features/user/user_data
  - features/user/user_domain
  - features/user/user_presentation

melos:
  runPubGetInParallel: false
  useRootAsPackage: false

  command:
    bootstrap:
      hooks:
        post: |
          flutter pub get
          melos list --cycles

  dependencies:
    hooks_riverpod: ^3.0.0
    flutter_hooks: ^0.21.3+1
    riverpod_annotation: ^4.0.0

    freezed_annotation: ^3.1.0
    json_annotation: ^4.9.0

    go_router: ^17.1.0

    sembast: ^3.8.6
    sembast_web: ^2.4.4+1
    path_provider: ^2.1.5
    path: ^1.9.1

  dev_dependencies:
    flutter_lints: ^6.0.0

    build_runner: ^2.11.0
    riverpod_generator: ^4.0.0

    freezed: ^3.2.3
    json_serializable: ^6.0.0

    golden_test: ^0.1.7
    mockito: ^5.6.3

  scripts:
    ############################################################################
    # Installation
    ############################################################################
    generate:
      description: Generate model for specific package
      run: melos exec --order-dependents -- "dart run build_runner build --delete-conflicting-outputs"
      concurrency: 3
      packageFilters:
        dependsOn:
          - build_runner

    generate:all:
      description: Generate model for all packages
      run: |
        melos run generate && melos run generate:l10n

    generate:l10n:
      description: Generate localization files
      run: |
        melos exec --scope="tt_i18n" -- "flutter gen-l10n"

    clean:deep:
      description: Clean all project
      run: |
        melos exec --fail-fast -- "flutter clean" && find . -type f -name "*.lock" -delete && find . -type f -name "*.freezed.dart" -delete && find . -type f -name "*.g.dart" -delete && find . -type f -name "*.mocks.dart" -delete
      concurrency: 1

    ############################################################################
    # Global linter commands
    ############################################################################
    lint:all:
      description: Run all static analysis checks.
      run: |
        melos run analyze && melos run format

    analyze:
      description: |
        Run `flutter analyze` in all packages.
        - Note: you can also rely on your IDEs Dart Analysis / Issues window.
      # We are setting the concurrency to 1 because a higher concurrency can crash
      # the analysis server on low performance machines (like GitHub Actions).
      run: |
        melos exec -- "flutter analyze . --fatal-infos"
      concurrency: 1

    format:
      description: Run `dart format` for all packages.
      run: |
        melos exec -- "dart format . --line-length 180"

    format-check:
      description: Run `dart format` checks for all packages.
      run: |
        melos exec -- "dart format . --line-length 180 --set-exit-if-changed"

    ############################################################################
    # Global test commands
    ############################################################################
    test:
      description: Run `flutter test` for selected packages.
      run: |
        melos exec --fail-fast --dir-exists="test" -- flutter test --no-pub --coverage
      concurrency: 3
      packageFilters:
        dirExists:
          - test

    test:all:
      description: Run all Flutter tests in this project.
      run: |
        melos run test --no-select

    test:update-goldens:
      description: Re-generate all golden test files
      run: |
        melos exec -- "flutter test --update-goldens"
      packageFilters:
        dirExists: test

    update:all:
      description: Update all dependencies to the latest versions
      run: |
        melos exec -- "flutter pub upgrade --major-versions"
      concurrency: 3
